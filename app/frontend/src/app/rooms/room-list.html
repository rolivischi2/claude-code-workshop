<h1>Räume</h1>
<table>
  <thead>
    <tr>
      <th>Name</th>
      <th>Kapazität</th>
      <th>Stockwerk</th>
    </tr>
  </thead>
  <tbody>
    @for (room of rooms(); track room.id) {
      <tr data-testid="room-row">
        <td>
          <a [routerLink]="['/rooms', room.id]">{{ room.name }}</a>
        </td>
        <td>{{ room.capacity }} Personen</td>
        <td>{{ room.floor }}</td>
      </tr>
    } @empty {
      <tr>
        <td colspan="3">Keine Räume gefunden.</td>
      </tr>
    }
  </tbody>
</table>
