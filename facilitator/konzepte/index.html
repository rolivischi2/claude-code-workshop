<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Code – Concepts</title>
<!-- Motor und Grundstil kommen aus rag/viz (gleiche Tasten, gleiche Bausteine). -->
<link rel="stylesheet" href="../../rag/viz/style.css">
<link rel="stylesheet" href="konzepte.css">
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <nav class="fields" id="fields" aria-label="Scenes"></nav>
    <button class="qchip" id="qchip" type="button" hidden></button>
  </header>
  <section class="head" id="head">
    <h1 id="title"></h1>
    <p class="lead" id="lead"></p>
    <div class="beats" id="beats" aria-hidden="true"></div>
  </section>
  <main class="stage" id="stage"></main>
  <footer class="foot">
    <span class="keys" id="keys"></span>
    <span class="meta" id="meta"></span>
    <span class="badge-sample" id="sample" hidden></span>
  </footer>
</div>
<div class="overlay" id="picker" hidden></div>
<div class="overlay" id="help" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="../../rag/viz/viz.js"></script>
<script src="scenes-konzepte.js"></script>
<script>
  VIZ.ORDER = ['karte', 'kontext', 'leitplanken', 'mcp', 'skalieren', 'rueckblick'];
  VIZ.META = ['Claude Code workshop', 'Schematic, not to scale'];
  VIZ.boot({}, false);
</script>
</body>
</html>
