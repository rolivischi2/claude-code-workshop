# Quellen für den RAG-Korpus: öffentliche Publikationen des BAZG zum Transit-/Versandverfahren (NCTS).
# `uv run fetch` lädt sie nach rag/.cache/sources/ (nicht im Repo), `uv run convert` macht daraus
# Markdown in rag/.cache/corpus/. Die PDFs und ihr Text gehören dem BAZG und werden nicht committet.
#
# Felder: id (kebab-case mit Sprachsuffix), title, lang, url, sha256 (von `uv run fetch` geprüft;
# leer = beim ersten Download eintragen), note (warum das Dokument im Korpus ist).
#
# Französische/italienische Dokumente sind bewusst NUR in dieser Sprache im Korpus (die deutsche
# Fassung fehlt absichtlich), damit es Fragen gibt, deren Antwort nur fremdsprachig vorliegt.
# Stand der Links: November 2026 (Übersichtsseiten: bazg.admin.ch/de/publikationen-transitverfahren
# und bazg.admin.ch/de/r-14-richtlinie-transitverfahren).
