# Evaluation questions for the RAG exercise (exercise 11).
# Every question is in German. "expected" lists the doc ids that contain the answer.
# Categories:
#   synonym          - target doc uses different words than the question (same language)
#   cross-lingual    - answer only exists in a French or English doc
#   exact-identifier - question contains an error code or config key
#   multi-doc        - the answer needs more than one doc
questions:
  # --- synonym --------------------------------------------------------------
  - id: S1
    category: synonym
    question: Was passiert bei einer Doppelbelegung eines Raums?
    expected: [product-booking-conflicts]
  - id: S2
    category: synonym
    question: Bis wann kann ich eine Reservation gratis absagen?
    expected: [product-cancellation-policy]
  - id: S3
    category: synonym
    question: Wer muss meinen Pull Request anschauen, bevor er gemergt wird?
    expected: [guidelines-code-review]
  - id: S4
    category: synonym
    question: Wann dürfen wir neue Versionen live schalten?
    expected: [ops-deployment-process]
  - id: S5
    category: synonym
    question: Wie schnell muss die Bereitschaftsperson reagieren?
    expected: [ops-on-call]
  - id: S6
    category: synonym
    question: Wie lange darf ein Meeting im Raum höchstens dauern?
    expected: [product-booking-rules]
  - id: S7
    category: synonym
    question: Wie stelle ich eine kaputte Produktivversion auf den alten Stand zurück?
    expected: [ops-rollback]
  # --- cross-lingual --------------------------------------------------------
  - id: C1
    category: cross-lingual
    question: Wie oft wird die Datenbank gesichert?
    expected: [ops-backup-restore]
  - id: C2
    category: cross-lingual
    question: Ab welcher Antwortzeit wird die Pikett-Person alarmiert?
    expected: [ops-monitoring-alerts]
  - id: C3
    category: cross-lingual
    question: Wie lange werden Logdateien aufbewahrt?
    expected: [ops-log-retention]
  - id: C4
    category: cross-lingual
    question: Was geschieht, wenn niemand zu einer gebuchten Sitzung erscheint?
    expected: [product-no-show]
  - id: C5
    category: cross-lingual
    question: Welche Räume sind rollstuhlgängig?
    expected: [product-accessibility]
  - id: C6
    category: cross-lingual
    question: Wie viele Personen passen maximal auf die Warteliste?
    expected: [product-waitlist-concept]
  - id: C7
    category: cross-lingual
    question: Wann wird das Personenverzeichnis synchronisiert?
    expected: [architecture-integration-directory]
  - id: C8
    category: cross-lingual
    question: Wie oft müssen Passwörter und Schlüssel erneuert werden?
    expected: [ops-secrets-rotation]
  # --- exact-identifier -----------------------------------------------------
  - id: E1
    category: exact-identifier
    question: Was bedeutet der Fehlercode RR-5031?
    expected: [errors-server-errors-rr50xx]
  - id: E2
    category: exact-identifier
    question: Welchen Standardwert hat rr.notify.batch-size?
    expected: [config-notification-settings]
  - id: E3
    category: exact-identifier
    question: Wofür steht RR-6023?
    expected: [errors-integration-errors-rr60xx]
  - id: E4
    category: exact-identifier
    question: Wie ist rr.cleanup.cron eingestellt?
    expected: [config-cleanup-settings]
  - id: E5
    category: exact-identifier
    question: Was ist der Default von rr.cache.rooms.ttl?
    expected: [config-cache-settings]
  - id: E6
    category: exact-identifier
    question: Welcher Fehler ist RR-4103?
    expected: [errors-auth-errors-rr41xx]
  # --- multi-doc ------------------------------------------------------------
  - id: M1
    category: multi-doc
    question: Wie lange bleiben Namen von Organisatoren gespeichert und welcher Job entfernt sie?
    expected: [product-data-protection, config-cleanup-settings]
  - id: M2
    category: multi-doc
    question: Eine Produktivsetzung ist schiefgegangen und es fehlen Daten. Welche Schritte gibt es?
    expected: [ops-rollback, ops-backup-restore]
  - id: M3
    category: multi-doc
    question: Welche Regeln gelten für Fehlerantworten der API und warum wurden sie so entschieden?
    expected: [guidelines-error-handling, architecture-adr-002-problem-details]
  - id: M4
    category: multi-doc
    question: Wie funktioniert die Warteliste und ist sie in Produktion schon eingeschaltet?
    expected: [product-waitlist-concept, config-feature-flags]
